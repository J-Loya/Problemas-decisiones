<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3.1 — Puede votar</title>
  <link rel="stylesheet" href="../styles/main.css" />
</head>
<body>
  <div class="page-wrapper">

    <header class="problem-header">
      <p class="problem-number">Problema 3.1</p>
      <h1 class="problem-title">Puede votar</h1>
    </header>

    <div class="card">
      <p class="card-title">Datos</p>

      <div class="field">
        <label for="edad">Edad</label>
        <input type="number" id="edad" min="0" step="1" placeholder="ej. 25" />
        <p class="error-msg" id="errEdad">Ingresa una edad válida (> 0).</p>
      </div>

      <button class="btn-primary" onclick="verificarVoto()">Verificar</button>

      <div class="result-block" id="resultBlock">
        <div class="result-total">
          <span class="label">Resultado</span>
          <span class="amount" id="resVoto">—</span>
        </div>
      </div>
    </div>

  </div>
  <script src="../scripts/P3.1.js"></script>
</body>
</html>
