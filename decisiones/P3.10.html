<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3.10 — Vacaciones con La tortuga</title>
  <link rel="stylesheet" href="../styles/main.css" />
</head>
<body>
  <div class="page-wrapper">

    <header class="problem-header">
      <p class="problem-number">Problema 3.10</p>
      <h1 class="problem-title">Vacaciones con La tortuga</h1>
    </header>

    <div class="card">
      <p class="card-title">Datos del viajero</p>

      <div class="field">
        <label for="presupuesto">Presupuesto disponible ($)</label>
        <input type="number" id="presupuesto" min="0" step="0.01" placeholder="ej. 5000.00" />
        <p class="error-msg" id="errPresupuesto">Ingresa un presupuesto válido (>= 0).</p>
      </div>

      <div class="field">
        <label for="costoPorKm">Costo por km ($)</label>
        <input type="number" id="costoPorKm" min="0" step="0.01" placeholder="ej. 5.50" />
        <p class="error-msg" id="errCostoPorKm">Ingresa un costo válido (> 0).</p>
      </div>

      <button class="btn-primary" onclick="determinarDestino()">Determinar destino</button>

      <div class="result-block" id="resultBlock">
        <div class="result-total">
          <span class="label">Destino recomendado</span>
          <span class="amount" id="resDestino">—</span>
        </div>
        <div class="result-total">
          <span class="label">Costo del viaje</span>
          <span class="amount" id="resCosto">—</span>
        </div>
      </div>
    </div>

  </div>
  <script src="../scripts/P3.10.js"></script>
</body>
</html>
