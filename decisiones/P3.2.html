<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3.2 — Sueldo semanal</title>
  <link rel="stylesheet" href="../styles/main.css" />
</head>
<body>
  <div class="page-wrapper">

    <header class="problem-header">
      <p class="problem-number">Problema 3.2</p>
      <h1 class="problem-title">Sueldo semanal</h1>
    </header>

    <div class="card">
      <p class="card-title">Datos</p>

      <div class="field">
        <label for="horas">Horas trabajadas</label>
        <input type="number" id="horas" min="0" step="0.5" placeholder="ej. 45" />
        <p class="error-msg" id="errHoras">Ingresa horas válidas (>= 0).</p>
      </div>

      <div class="field">
        <label for="pago">Pago por hora ($)</label>
        <input type="number" id="pago" min="0" step="0.01" placeholder="ej. 15.50" />
        <p class="error-msg" id="errPago">Ingresa un pago válido (> 0).</p>
      </div>

      <button class="btn-primary" onclick="calcularSueldo()">Calcular</button>

      <div class="result-block" id="resultBlock">
        <div class="result-total">
          <span class="label">Sueldo semanal</span>
          <span class="amount" id="resSueldo">—</span>
        </div>
      </div>
    </div>

  </div>
  <script src="../scripts/P3.2.js"></script>
</body>
</html>
