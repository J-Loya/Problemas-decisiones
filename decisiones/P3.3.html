<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3.3 — Regalo del 14 de febrero</title>
  <link rel="stylesheet" href="../styles/main.css" />
</head>
<body>
  <div class="page-wrapper">

    <header class="problem-header">
      <p class="problem-number">Problema 3.3</p>
      <h1 class="problem-title">Regalo del 14 de febrero</h1>
    </header>

    <div class="card">
      <p class="card-title">Datos</p>

      <div class="field">
        <label for="presupuesto">Presupuesto ($)</label>
        <input type="number" id="presupuesto" min="0" step="0.01" placeholder="ej. 75.00" />
        <p class="error-msg" id="errPresupuesto">Ingresa un presupuesto válido (>= 0).</p>
      </div>

      <button class="btn-primary" onclick="determinarRegalo()">Determinar regalo</button>

      <div class="result-block" id="resultBlock">
        <div class="result-total">
          <span class="label">Regalo recomendado</span>
          <span class="amount" id="resRegalo">—</span>
        </div>
      </div>
    </div>

  </div>
  <script src="../scripts/P3.3.js"></script>
</body>
</html>
