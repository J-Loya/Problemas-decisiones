<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3.4 — Tarifa de estacionamiento</title>
  <link rel="stylesheet" href="../styles/main.css" />
</head>
<body>
  <div class="page-wrapper">

    <header class="problem-header">
      <p class="problem-number">Problema 3.4</p>
      <h1 class="problem-title">Tarifa de estacionamiento</h1>
    </header>

    <div class="card">
      <p class="card-title">Datos</p>

      <div class="field">
        <label for="horas">Horas estacionadas</label>
        <input type="number" id="horas" min="0" step="0.5" placeholder="ej. 7" />
        <p class="error-msg" id="errHoras">Ingresa horas válidas (> 0).</p>
      </div>

      <button class="btn-primary" onclick="calcularTarifa()">Calcular</button>

      <div class="result-block" id="resultBlock">
        <div class="result-total">
          <span class="label">Costo total</span>
          <span class="amount" id="resTarifa">—</span>
        </div>
      </div>
    </div>

  </div>
  <script src="../scripts/P3.4.js"></script>
</body>
</html>
