<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3.6 — Costo y descuento de artículo</title>
  <link rel="stylesheet" href="../styles/main.css" />
</head>
<body>
  <div class="page-wrapper">

    <header class="problem-header">
      <p class="problem-number">Problema 3.6</p>
      <h1 class="problem-title">Costo y descuento de artículo</h1>
    </header>

    <div class="card">
      <p class="card-title">Datos</p>

      <div class="field">
        <label for="precio">Precio ($)</label>
        <input type="number" id="precio" min="0" step="0.01" placeholder="ej. 150.00" />
        <p class="error-msg" id="errPrecio">Ingresa un precio válido (> 0).</p>
      </div>

      <button class="btn-primary" onclick="calcularDescuento()">Calcular</button>

      <div class="result-block" id="resultBlock">
        <div class="result-total">
          <span class="label">Descuento</span>
          <span class="amount" id="resDescuento">—</span>
        </div>
        <div class="result-total">
          <span class="label">Precio final</span>
          <span class="amount" id="resFinal">—</span>
        </div>
      </div>
    </div>

  </div>
  <script src="../scripts/P3.6.js"></script>
</body>
</html>
