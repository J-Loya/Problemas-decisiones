<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3.7 — Programa de becas</title>
  <link rel="stylesheet" href="../styles/main.css" />
</head>
<body>
  <div class="page-wrapper">

    <header class="problem-header">
      <p class="problem-number">Problema 3.7</p>
      <h1 class="problem-title">Programa de becas</h1>
    </header>

    <div class="card">
      <p class="card-title">Datos del estudiante</p>

      <div class="field">
        <label for="edad">Edad</label>
        <input type="number" id="edad" min="0" step="1" placeholder="ej. 20" />
        <p class="error-msg" id="errEdad">Ingresa una edad válida (> 0).</p>
      </div>

      <div class="field">
        <label for="promedio">Promedio</label>
        <input type="number" id="promedio" min="0" max="10" step="0.1" placeholder="ej. 8.5" />
        <p class="error-msg" id="errPromedio">Ingresa un promedio válido (0 a 10).</p>
      </div>

      <button class="btn-primary" onclick="calcularBeca()">Calcular beca</button>

      <div class="result-block" id="resultBlock">
        <div class="result-total">
          <span class="label">Resultado</span>
          <span class="amount" id="resBeca">—</span>
        </div>
      </div>
    </div>

  </div>
  <script src="../scripts/P3.7.js"></script>
</body>
</html>
