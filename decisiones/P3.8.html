<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3.8 — Bono mensual de trabajador</title>
  <link rel="stylesheet" href="../styles/main.css" />
</head>
<body>
  <div class="page-wrapper">

    <header class="problem-header">
      <p class="problem-number">Problema 3.8</p>
      <h1 class="problem-title">Bono mensual de trabajador</h1>
    </header>

    <div class="card">
      <p class="card-title">Datos del trabajador</p>

      <div class="field">
        <label for="antiguedad">Antigüedad (años)</label>
        <input type="number" id="antiguedad" min="0" step="0.1" placeholder="ej. 4" />
        <p class="error-msg" id="errAntiguedad">Ingresa una antigüedad válida (>= 0).</p>
      </div>

      <div class="field">
        <label for="sueldo">Sueldo ($)</label>
        <input type="number" id="sueldo" min="0" step="0.01" placeholder="ej. 2500.00" />
        <p class="error-msg" id="errSueldo">Ingresa un sueldo válido (> 0).</p>
      </div>

      <button class="btn-primary" onclick="calcularBono()">Calcular</button>

      <div class="result-block" id="resultBlock">
        <div class="result-total">
          <span class="label">Bono por antigüedad</span>
          <span class="amount" id="resBonoAntiguedad">—</span>
        </div>
        <div class="result-total">
          <span class="label">Bono por sueldo</span>
          <span class="amount" id="resBonoSueldo">—</span>
        </div>
        <div class="result-total">
          <span class="label">Bono mayor</span>
          <span class="amount" id="resBonoMayor">—</span>
        </div>
      </div>
    </div>

  </div>
  <script src="../scripts/P3.8.js"></script>
</body>
</html>
