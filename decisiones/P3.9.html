<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3.9 — Póliza de seguros de auto</title>
  <link rel="stylesheet" href="../styles/main.css" />
</head>
<body>
  <div class="page-wrapper">

    <header class="problem-header">
      <p class="problem-number">Problema 3.9</p>
      <h1 class="problem-title">Póliza de seguros de auto</h1>
    </header>

    <div class="card">
      <p class="card-title">Datos del asegurado</p>

      <div class="field">
        <label for="poliza">Tipo de póliza</label>
        <select id="poliza">
          <option value="A">Cobertura Amplia (A) - $1,200</option>
          <option value="B">Daños a Terceros (B) - $950</option>
        </select>
      </div>

      <div class="field">
        <label for="edad">Edad</label>
        <input type="number" id="edad" min="0" step="1" placeholder="ej. 35" />
        <p class="error-msg" id="errEdad">Ingresa una edad válida (> 0).</p>
      </div>

      <div class="field">
        <label for="alcohol">¿Bebe alcohol habitualmente?</label>
        <select id="alcohol">
          <option value="no">No (+0%)</option>
          <option value="si">Sí (+10%)</option>
        </select>
      </div>

      <div class="field">
        <label for="lentes">¿Utiliza lentes?</label>
        <select id="lentes">
          <option value="no">No (+0%)</option>
          <option value="si">Sí (+5%)</option>
        </select>
      </div>

      <div class="field">
        <label for="enfermedad">¿Padece enfermedad crónica?</label>
        <select id="enfermedad">
          <option value="no">No (+0%)</option>
          <option value="si">Sí (+5%)</option>
        </select>
      </div>

      <button class="btn-primary" onclick="calcularPoliza()">Calcular póliza</button>

      <div class="result-block" id="resultBlock">
        <div class="result-total">
          <span class="label">Cuota base</span>
          <span class="amount" id="resBase">—</span>
        </div>
        <div class="result-total">
          <span class="label">Cargos adicionales</span>
          <span class="amount" id="resCargos">—</span>
        </div>
        <div class="result-total">
          <span class="label">Total a pagar</span>
          <span class="amount" id="resTotal">—</span>
        </div>
      </div>
    </div>

  </div>
  <script src="../scripts/P3.9.js"></script>
</body>
</html>
